name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - run: npm i -g npm@latest

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Setup
        run: npm i -g pnpm@9

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Publish to NPM
        run: |
          pnpm run build
          TARBALL=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npm publish "$TARBALL" --access public
        working-directory: ./packages/core

      - name: Publish eslint-plugin to NPM
        run: |
          pnpm run build
          TARBALL=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npm publish "$TARBALL" --access public
        working-directory: ./packages/eslint

      - name: Publish mcp to NPM
        run: |
          pnpm run build
          TARBALL=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npm publish "$TARBALL" --access public
        working-directory: ./packages/mcp

      - name: Publish to VSCE
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-beta"* ]]; then
            pnpm vsce publish --no-dependencies --pre-release -p ${{secrets.VSCE_TOKEN}}
          else
            pnpm vsce publish --no-dependencies -p ${{secrets.VSCE_TOKEN}}
          fi
        working-directory: ./packages/vscode
        env:
          VSCE_TOKEN: ${{secrets.VSCE_TOKEN}}
